name: Deploy to EC2

on:
  workflow_dispatch:
    inputs:
      services:
        description: 'Services to start'
        required: false
        default: 'backend' # Alterado aqui para evitar o erro de 'no such service'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build deploy .env
        run: |
          mkdir -p artifact
          echo "BACKEND_IMAGE=ghcr.io/${{ github.repository_owner }}/projeto-backend:${{ github.sha }}" > artifact/.env
          echo "DB_NAME=${{ secrets.DB_NAME }}" >> artifact/.env
          echo "DB_USERNAME=${{ secrets.DB_USERNAME }}" >> artifact/.env
          echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" >> artifact/.env
          echo "DB_PORT=${{ secrets.DB_PORT }}" >> artifact/.env
          echo "DB_PATH=jdbc:postgresql://db:5432/${{ secrets.DB_NAME }}" >> artifact/.env
          echo "RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}" >> artifact/.env
          echo "BACKEND_PORT=${{ secrets.BACKEND_PORT }}" >> artifact/.env

      - name: Prepare artifacts
        run: |
          cp docker-compose.deploy.yml artifact/
          if [ -d Source/Server/SpringBootApp/src/main/resources/migrations ]; then
            cp -r Source/Server/SpringBootApp/src/main/resources/migrations artifact/migrations
          fi
          tar -czf deploy_artifacts.tar.gz -C artifact .

      - name: Copy to EC2
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: deploy_artifacts.tar.gz
          target: ${{ github.event.inputs.deploy_path || '/home/ubuntu/app' }}

      - name: Execute Deploy
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ${{ github.event.inputs.deploy_path || '/home/ubuntu/app' }}
            tar -xzf deploy_artifacts.tar.gz && rm deploy_artifacts.tar.gz
            
            # Remove contêineres órfãos de execuções anteriores
            docker compose -f docker-compose.deploy.yml down --remove-orphans || true
            
            # Sobe o banco de dados
            docker compose -f docker-compose.deploy.yml up -d db
            
            # Executa as migrações (agora com PGPASSWORD configurado no ambiente)
            docker compose -f docker-compose.deploy.yml run --rm migrate
            
            # Sobe o backend definitivo
            docker compose -f docker-compose.deploy.yml up -d backend