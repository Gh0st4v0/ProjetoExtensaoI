name: Deploy to EC2

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Ambiente de Deploy'
        required: true
        default: 'stage'
        type: choice
        options:
          - stage
          - prod
      services:
        description: 'Services to start'
        required: false
        default: 'backend,frontend'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build deploy .env
        run: |
          mkdir -p artifact
          # Força o nome do dono do repositório a ficar totalmente em letras minúsculas
          REPO_OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          
          # Mantido seu ref_name para casar com a tag da branch
          echo "BACKEND_IMAGE=ghcr.io/${REPO_OWNER_LOWER}/projeto-backend:${{ github.ref_name }}" > artifact/.env
          echo "FRONTEND_IMAGE=ghcr.io/${REPO_OWNER_LOWER}/projeto-frontend:${{ github.ref_name }}" >> artifact/.env
          
          echo "DB_NAME=${{ secrets.DB_NAME }}" >> artifact/.env
          echo "DB_USERNAME=${{ secrets.DB_USERNAME }}" >> artifact/.env
          echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" >> artifact/.env
          echo "DB_PORT=${{ secrets.DB_PORT }}" >> artifact/.env
          echo "DB_PATH=jdbc:postgresql://db:5432/${{ secrets.DB_NAME }}" >> artifact/.env
          echo "RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}" >> artifact/.env
          echo "BACKEND_PORT=${{ secrets.BACKEND_PORT }}" >> artifact/.env
          echo "JWT_SECRET_KEY=${{ secrets.JWT_SECRET_KEY }}" >> artifact/.env
          echo "FRONTEND_PORT=${{ secrets.FRONTEND_PORT }}" >> artifact/.env

      - name: Prepare artifacts
        run: |
          cp docker-compose.deploy.yml artifact/
          if [ -d Source/Server/SpringBootApp/src/main/resources/migrations ]; then
            cp -r Source/Server/SpringBootApp/src/main/resources/migrations artifact/migrations
          fi
          tar -czf deploy_artifacts.tar.gz -C artifact .

      - name: Copy to EC2
        uses: appleboy/scp-action@master
        with:
          host: ${{ inputs.environment == 'stage' && secrets.EC2_HOST_STAGE || secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ inputs.environment == 'stage' && secrets.EC2_PRIVATE_KEY_STAGE || secrets.SSH_PRIVATE_KEY }}
          source: deploy_artifacts.tar.gz
          target: ${{ github.event.inputs.deploy_path || '/home/ubuntu/app' }}

      - name: Execute Deploy
        uses: appleboy/ssh-action@master
        with:
          host: ${{ inputs.environment == 'stage' && secrets.EC2_HOST_STAGE || secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ inputs.environment == 'stage' && secrets.EC2_PRIVATE_KEY_STAGE || secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ${{ github.event.inputs.deploy_path || '/home/ubuntu/app' }}
            tar -xzf deploy_artifacts.tar.gz && rm deploy_artifacts.tar.gz
            
            # Remove volumes antigos para não misturar dados
            docker compose -f docker-compose.deploy.yml down -v --remove-orphans || true
            
            # Baixa as imagens mais recentes do GHCR (evita o cache antigo na AWS)
            docker compose -f docker-compose.deploy.yml pull
            
            # Sobe o banco de dados
            docker compose -f docker-compose.deploy.yml up -d db
            
            # Executa a limpeza do histórico do Flyway
            docker compose -f docker-compose.deploy.yml run --rm migrate repair
            
            # Roda as migrações 
            docker compose -f docker-compose.deploy.yml run --rm migrate migrate
            
            # Sobe os apps finais apontando para a imagem correta da branch
            docker compose -f docker-compose.deploy.yml up -d