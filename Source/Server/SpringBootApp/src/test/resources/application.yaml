spring:
  application:
    name: JuniorPrimeBeef
  flyway:
    enabled: false
  datasource:
    url: ${DB_PATH:jdbc:postgresql://localhost:5432/JuniorPrimeBeef}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
jwt:
  secret: ${JWT_SECRET_KEY:mySecretKey}
  expiration: ${JWT_EXPIRATION:86400000}

