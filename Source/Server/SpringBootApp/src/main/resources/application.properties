# Ensure the PostgreSQL JDBC driver sends string parameters as unspecified so Postgres can cast to enum types
spring.datasource.hikari.data-source-properties.stringtype=unspecified

# JWT secret (read from env JWT_SECRET_KEY; default only for local dev)
jwt.secret=${JWT_SECRET_KEY:mySecretKey}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Resend API key (read from env RESEND_API_KEY)
RESEND_API_KEY=${RESEND_API_KEY:not-configured}

