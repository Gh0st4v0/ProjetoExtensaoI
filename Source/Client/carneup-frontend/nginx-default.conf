server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Proxy common API endpoints to backend container
  location ~ ^/(sessions|brands|categories|products|purchases|despesas|clients|sales|reports|auth)(/.*)?$ {
    proxy_pass http://backend:8080$uri;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
  }

  # Serve static files; fallback to index.html for SPA routes
  location / {
    try_files $uri $uri/ /index.html;
  }
}
