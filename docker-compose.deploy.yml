services:
  db:
    image: postgres:18
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USERNAME}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      # CORREÇÃO AQUI: Removido o "/data" do final do lado do container
      - /home/ubuntu/app/db-data:/var/lib/postgresql
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: ${BACKEND_IMAGE}
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy

  migrate:
    image: postgres:18
    env_file:
      - .env
    environment:
      - PGPASSWORD=${DB_PASSWORD}
      - PGUSER=${DB_USERNAME}
      - PGDATABASE=${DB_NAME}
      - PGHOST=db
    volumes:
      - ./migrations:/migrations:ro
    depends_on:
      db:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        for f in $$(ls /migrations/V*.sql | sort -V); do
          echo "Applying $$f"
          psql -f "$$f" || exit 1
        done

  frontend:
    image: ${FRONTEND_IMAGE}
    restart: unless-stopped
    depends_on:
      - backend

  proxy:
    image: 'jc21/nginx-proxy-manager:latest'
    restart: always
    ports:
      - '80:80'
      - '443:443'
      - '8181:81'
    volumes:
      # ALTERADO: Pastas físicas na AWS. Seus certificados e login nunca mais somem no deploy
      - /home/ubuntu/app/proxy-data:/data
      - /home/ubuntu/app/proxy-letsencrypt:/etc/letsencrypt