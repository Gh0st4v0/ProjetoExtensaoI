version: "3.8"

services:
  db:
    image: postgres:18
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USERNAME}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"

  backend:
    image: ${BACKEND_IMAGE}
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - db
    ports:
      - "${BACKEND_PORT:-8080}:8080"

  migrate:
    image: postgres:18
    env_file:
      - .env
    volumes:
      - ./migrations:/migrations:ro
    depends_on:
      - db
    # Run migration script from mounted migrations directory
    entrypoint: ["/bin/sh", "/migrations/run-migrations.sh"]

volumes:
  db-data: {}
