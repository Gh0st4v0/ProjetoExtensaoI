version: "3.8"

services:
  db:
    image: postgres:18
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USERNAME}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    # Adicionamos um teste nativo do Postgres para saber se ele já aceita conexões
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    image: ${BACKEND_IMAGE}
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      db:
        # O backend agora espera o db estar 'healthy' (saudável) em vez de apenas 'started'
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8080}:8080"

  migrate:
    image: postgres:18
    env_file:
      - .env
    volumes:
      - ./migrations:/migrations:ro
    depends_on:
      db:
        # O script de migração também vai esperar o banco estar 100% pronto
        condition: service_healthy
    # Run migration script from mounted migrations directory
    entrypoint: ["/bin/sh", "/migrations/run-migrations.sh"]

volumes:
  db-data: {}