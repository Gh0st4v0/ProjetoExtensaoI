services:
  db:
    image: postgres:18
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USERNAME}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: ${BACKEND_IMAGE}
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    # O backend não fica mais exposto direto para a internet na porta 8080 do host.
    # Ele agora opera de forma segura dentro da rede interna do Docker.

  migrate:
    image: postgres:18
    env_file:
      - .env
    environment:
      - PGPASSWORD=${DB_PASSWORD}
      - PGUSER=${DB_USERNAME}
      - PGDATABASE=${DB_NAME}
      - PGHOST=db
    volumes:
      - ./migrations:/migrations:ro
    depends_on:
      db:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        for f in $$(ls /migrations/V*.sql | sort -V); do
          echo "Applying $$f"
          psql -f "$$f" || exit 1
        done

  frontend:
    image: ${FRONTEND_IMAGE}
    restart: unless-stopped
    depends_on:
      - backend
    # Removemos a porta 5176/80 antiga daqui. O Proxy vai receber as requisições
    # nas portas oficiais (80/443) e repassar para o frontend internamente na porta 80.

  # O NOVO PORTEIRO DO SEU AMBIENTE (REVERSE PROXY + SSL)
  proxy:
    image: 'jc21/nginx-proxy-manager:latest'
    restart: always
    ports:
      - '80:80'     # Porta oficial para tráfego HTTP comum
      - '443:443'   # Porta oficial para tráfego HTTPS (Cadeado Seguro)
      - '8181:81' # Painel de controle visual onde você vai gerar o SSL
    volumes:
      - proxy-data:/data
      - proxy-letsencrypt:/etc/letsencrypt

# IMPORTANTE: Volumes persistentes do banco e do gerenciador de certificados
volumes:
  db-data: {}
  proxy-data: {}
  proxy-letsencrypt: {}