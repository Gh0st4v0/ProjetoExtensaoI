version: "3.8"

services:
  db:
    image: postgres:18
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USERNAME}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: ${BACKEND_IMAGE}
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8080}:8080"

  migrate:
    image: postgres:18
    env_file:
      - .env
    environment:
      - PGPASSWORD=${DB_PASSWORD}
      - PGUSER=${DB_USERNAME}
      - PGDATABASE=${DB_NAME}
      - PGHOST=db
    volumes:
      - ./migrations:/migrations:ro
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/migrations/run-migrations.sh"]

  frontend:
    image: ${FRONTEND_IMAGE}
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80" # Mapeia a porta do deploy (ex: 80 ou 3000)
    depends_on:
      - backend

volumes:
  db-data: {}